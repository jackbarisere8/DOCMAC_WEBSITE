name = "docmac-release-api"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
APP_SLUG = "docmac"
CDN_BASE_URL = "https://downloads.docmac.app"
DOWNLOAD_DOMAIN = "downloads.docmac.app"

[[d1_databases]]
binding = "DB"
database_name = "docmac-db"
database_id = "docmac-prod-d1-id"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RELEASES_BUCKET"
bucket_name = "docmac-releases"

[env.staging]
vars = { ENVIRONMENT = "staging", CDN_BASE_URL = "https://downloads-staging.docmac.app" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "docmac-staging-db"
database_id = "docmac-staging-d1-id"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "RELEASES_BUCKET"
bucket_name = "docmac-releases-staging"

