name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Build release pages and deployment artifact
        run: npm run build

      - name: Validate links, anchors, manifest, and checksums
        run: npm run validate

      - name: Ensure generated files are committed
        run: git diff --exit-code -- releases sitemap.xml

      - name: Run backend test suite
        run: npm test
