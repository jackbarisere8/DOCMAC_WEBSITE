name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Build release pages and deployment artifact
        run: npm run build

      - name: Validate links, anchors, manifest, and checksums
        run: npm run validate

      - name: Ensure generated files are committed
        run: git diff --exit-code -- releases sitemap.xml

      - name: Restore APK test fixture
        id: apk-fixture
        uses: actions/cache@v5
        with:
          path: .cache/apk/v1.0.4/app-release.apk
          key: apk-fixture-v1.0.4

      - name: Download APK test fixture
        if: steps.apk-fixture.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache/apk/v1.0.4
          curl --fail --location --retry 3 --silent --show-error \
            --output .cache/apk/v1.0.4/app-release.apk \
            https://github.com/jackbarisere8/DOCMAC/releases/download/v1.0.4/app-release.apk
          echo "1d4edc3c546e0818884eafeb6bbde3cb911668109871912c7809818ac1da2e6c  .cache/apk/v1.0.4/app-release.apk" \
            | sha256sum --check --strict

      - name: Run backend test suite
        run: npm test
